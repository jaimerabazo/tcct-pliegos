name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    # Además de main/develop, los PR entre ramas de feature (p. ej. las sub-fases del
    # bloque de tenancy, que se apilan unas sobre otras) también pasan por el gate: el
    # aislamiento cross-tenant no debería revisarse solo en el último PR de la serie.
    branches: [main, develop, 'feat/**']

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  integration:
    name: Aislamiento cross-tenant (Postgres real)
    runs-on: ubuntu-latest

    # Postgres efímero: se crea y se destruye con el job, así cada corrida parte de una
    # base limpia. Los dobles en memoria de la suite unitaria no ejecutan constraints,
    # cascadas ni políticas RLS — esto sí.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pliegos_test
        ports:
          - 5432:5432
        # Sin el healthcheck, los pasos siguientes arrancarían antes de que Postgres
        # acepte conexiones y la migración fallaría de forma intermitente.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pliegos_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `migrate deploy` (no `dev`): aplica las migraciones ya versionadas, sin generar
      # ninguna. Es el mismo comando que corre contra staging, así que este job también
      # verifica que la carpeta de migraciones se aplica limpia sobre una BD vacía.
      - name: Apply migrations
        run: npm run db:migrate:deploy

      - name: Run isolation suite
        run: npm run test:integration
